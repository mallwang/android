# =============================================================================
# Variables
# =============================================================================
variables:
  APP_NAME: 'woistwas'
  # See https://medium.com/@julien.sezn/android-docker-image-5ffd75fcd029
  BUILD_ANDROID_IMAGE: 'registry.gitlab.com/szndev/ci-droid:jdk17'
  BUILD_IONIC_IMAGE: 'node:16.20.2-alpine3.18'
  VERSION: '1.9'
  VERSION_CODE: 13

# =============================================================================
# Stages
# =============================================================================
stages:
  - build-ionic
  - build-android

# =============================================================================
# Cache
# =============================================================================
#cache:
#  key: ${CI_PROJECT_ID}
#  paths:
#    - .gradle/

# =============================================================================
# Templates
# =============================================================================
.build-ionic: &build-ionic
  stage: build-ionic
  image: ${BUILD_IONIC_IMAGE}
  script:
    - npm i -g @ionic/cli@6.12.0 @angular/cli@10.2.0
    - npm ci
    - npm run build:${ENVIRONMENT}
    - npx cap sync
  artifacts:
    paths:
      - android
      - node_modules/@capacitor/android/capacitor
      - node_modules/@capacitor/geolocation
      - www

.build-android: &build-android
  stage: build-android
  image: ${BUILD_ANDROID_IMAGE}
  before_script:
    - export GRADLE_USER_HOME=$(pwd)/.gradle
    - cd android
    - chmod +x ./gradlew
  artifacts:
    when: always
    paths:
      - android/*.apk

# =============================================================================
# Stage: build-ionic
# =============================================================================
build:ionic:dev:
  <<: *build-ionic
  variables:
    ENVIRONMENT: dev
  only:
    - branches
  except:
    - master

build:ionic:prod:
  <<: *build-ionic
  variables:
    ENVIRONMENT: prod
  only:
    - master

# =============================================================================
# Stage: build-android
# =============================================================================
build:android:dev:
  <<: *build-android
  dependencies:
    - build:ionic:dev
  only:
    - branches
  except:
    - master
  script:
    # Create a debug build
    - ./gradlew assembleDebug --stacktrace
    # Copy and rename the debug apk to build directory
    - cp app/build/outputs/apk/debug/app-debug.apk ${APP_NAME}-${VERSION_CODE}-${VERSION}-debug.apk

build:android:prod:
  <<: *build-android
  dependencies:
    - build:ionic:prod
  only:
    - master
  script:
    # Create the keystore
    - echo "${KEYSTORE_FILE}" | base64 -d > $(pwd)/my.keystore
    # Create a release build
    - >
      ./gradlew assembleRelease \
        -Pandroid.injected.signing.store.file=$(pwd)/my.keystore \
        -Pandroid.injected.signing.store.password=${KEYSTORE_PASSWORD} \
        -Pandroid.injected.signing.key.alias=${KEY_ALIAS} \
        -Pandroid.injected.signing.key.password=${KEY_PASSWORD}
    # Copy and rename the release apk to build directory
    - cp app/build/outputs/apk/release/app-release.apk ${APP_NAME}-${VERSION_CODE}-${VERSION}-release.apk
